<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Locked</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <div class="center">
      <h1>This profile is locked</h1>
      <p id="prompt">Enter your password to restore your tabs.</p>
      <form id="unlock-form">
        <input
          type="password"
          id="password"
          autocomplete="current-password"
          placeholder="Password"
          autofocus
        />
        <button type="submit" id="submit">Unlock</button>
        <div class="message" id="message" role="alert"></div>
      </form>
      <!--
        Escrow is an openly labeled feature, not a hidden backdoor: if a parent
        can open this profile, the lock screen says so. Shown only when a master
        password could actually work on *this* session.
      -->
      <button type="button" class="link" id="toggle-mode" hidden>Parent unlock</button>
    </div>
    <script type="module" src="lock.js"></script>
  </body>
</html>
